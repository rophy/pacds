name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build both architectures and the bundles only (no login, push, tag or release)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rophy/pacds

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run pytest tests/unit tests/contract -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pacds:ci
      - run: scripts/image-smoke.sh pacds:ci
      - name: Validate the release bundles
        run: scripts/build-bundles.sh 0.0.0-ci dist

  e2e:
    needs: test
    if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: ./scripts/e2e.sh

  release:
    needs: e2e
    if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        id: version
        run: |
          ver=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"
      - name: Check if the version is released
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: building only, no login, push, tag or release"
          fi
      - name: Decide
        id: plan
        run: |
          # build when the version is new, or on a dry run; publish only when it is new, on master, and not a dry run
          if [ "$DRY_RUN" = "true" ] || [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$IS_MASTER" = "true" ] && [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.plan.outputs.build == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.build == 'true'
      - name: Log in to ghcr.io
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push when new) the multi-arch image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.plan.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:latest
          build-args: |
            PACDS_VERSION=${{ steps.version.outputs.version }}
      - name: Build the bundles
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-bundles.sh "$VERSION" dist
      - name: Create the tag and release
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body > notes.md
          # shellcheck disable=SC2016
          printf '\n\n## Docker image\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$VERSION" >> notes.md
          # creates the tag together with the release, so a failed run leaves no tag behind
          gh release create "$tag" --target "$GITHUB_SHA" -F notes.md dist/*.tar.gz
