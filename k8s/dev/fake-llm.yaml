apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds-fake-llm
  namespace: pacds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pacds-llm
  template:
    metadata:
      labels:
        app: pacds-llm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: fake-llm
          image: pacds
          command: ["pacds-fake-llm"]
          env:
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pacds-llm
  namespace: pacds
spec:
  selector:
    app: pacds-llm
  ports:
    - port: 8000
      targetPort: 8000
