# Dev-only S3 (MinIO): clients hand PACDS presigned URLs to logs stored here.
apiVersion: v1
kind: Secret
metadata:
  name: pacds-s3
  namespace: pacds
stringData:
  access-key: pacds-dev
  secret-key: pacds-dev-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pacds-s3
  namespace: pacds
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds-s3
  namespace: pacds
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pacds-s3
  template:
    metadata:
      labels:
        app: pacds-s3
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: ghcr.io/rophy/minio:20260423-9db4f623
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pacds-s3
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pacds-s3
                  key: secret-key
            # Lets `mc` inside the pod (used by scripts/seed-logs.sh) reach this server.
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@localhost:9000
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pacds-s3
---
apiVersion: v1
kind: Service
metadata:
  name: pacds-s3
  namespace: pacds
spec:
  selector:
    app: pacds-s3
  ports:
    - port: 9000
      targetPort: 9000
