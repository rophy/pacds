apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacds
  namespace: pacds
---
# Lets PACDS read the cluster's OIDC discovery document and JWKS to verify ServiceAccount tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacds-service-account-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: pacds
    namespace: pacds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds
  namespace: pacds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pacds
  template:
    metadata:
      labels:
        app: pacds
    spec:
      serviceAccountName: pacds
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pacds
          image: pacds
          ports:
            - containerPort: 8080
          env:
            - name: PACDS_CONFIG
              value: /etc/pacds/config.yaml
            - name: PACDS_LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: base-url
            - name: PACDS_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: model
            - name: PACDS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pacds-llm
                  key: api-key
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/pacds
              readOnly: true
            - name: git-cache
              mountPath: /var/cache/pacds
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pacds-config
        - name: git-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pacds
  namespace: pacds
spec:
  selector:
    app: pacds
  ports:
    - port: 8080
      targetPort: 8080
