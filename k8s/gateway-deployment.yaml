apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds-gateway
  namespace: pacds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacds-gateway
  template:
    metadata:
      labels:
        app: pacds-gateway
    spec:
      containers:
        - name: gateway
          image: pacds-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AGENT_ENDPOINT
              value: "http://pacds-agent:3001"
            - name: AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: pacds-auth
                  key: tokens
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pacds-gateway
  namespace: pacds
spec:
  selector:
    app: pacds-gateway
  ports:
    - port: 3000
      targetPort: 3000
