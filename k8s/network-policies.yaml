apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pacds-policy
  namespace: pacds
spec:
  podSelector:
    matchLabels:
      app: pacds
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pacds-llm
      ports:
        - port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: pacds-logs
      ports:
        - port: 8000
    # PRODUCTION: restrict to the git server, log storage, LLM endpoint and API server CIDRs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
        - port: 6443
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pacds-dev-backends
  namespace: pacds
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [pacds-llm, pacds-logs]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pacds
      ports:
        - port: 8000
  egress: []
