apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-policy
  namespace: pacds
spec:
  podSelector:
    matchLabels:
      app: pacds-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pacds-agent
      ports:
        - port: 3001
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-policy
  namespace: pacds
spec:
  podSelector:
    matchLabels:
      app: pacds-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pacds-gateway
      ports:
        - port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pacds-llm
      ports:
        - port: 8000
    # PRODUCTION: Replace 0.0.0.0/0 with your GitLab and Loki CIDRs to restrict egress per the PACDS spec.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
        - port: 80
        - port: 3100
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-policy
  namespace: pacds
spec:
  podSelector:
    matchLabels:
      app: pacds-llm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pacds-agent
      ports:
        - port: 8000
  egress: []
