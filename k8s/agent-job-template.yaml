apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds-agent
  namespace: pacds
  annotations:
    description: "Placeholder deployment. In production, replace with per-session Jobs."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pacds-agent
  template:
    metadata:
      labels:
        app: pacds-agent
    spec:
      containers:
        - name: agent
          image: pacds-agent:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: GIT_URL
              value: ""
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pacds-git
                  key: token
            - name: LOG_PROVIDER
              value: '{"type":"loki","url":"http://loki:3100"}'
            - name: LLM_PROVIDER
              value: "vllm-local"
            - name: LLM_MODEL
              value: "meta-llama-3.1-70b"
            - name: LLM_BASE_URL
              value: "http://pacds-llm:8000/v1"
            - name: REPO_BASE_DIR
              value: "/repos"
            - name: SERVICE_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: service-registry
                  key: registry.json
          volumeMounts:
            - name: repo-storage
              mountPath: /repos
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: repo-storage
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pacds-agent
  namespace: pacds
spec:
  selector:
    app: pacds-agent
  ports:
    - port: 3001
      targetPort: 3001
