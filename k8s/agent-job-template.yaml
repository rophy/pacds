apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacds-agent
  namespace: pacds
  annotations:
    description: "Placeholder deployment. In production, replace with per-session Jobs."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pacds-agent
  template:
    metadata:
      labels:
        app: pacds-agent
    spec:
      containers:
        - name: agent
          image: pacds-agent:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: GIT_URL
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: GIT_URL
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pacds-git
                  key: token
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: LLM_PROVIDER
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: LLM_MODEL
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: LLM_BASE_URL
            - name: LLM_API_TYPE
              valueFrom:
                configMapKeyRef:
                  name: pacds-llm-config
                  key: LLM_API_TYPE
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pacds-llm
                  key: api-key
            - name: REPO_BASE_DIR
              value: "/repos"
            - name: SERVICE_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: service-registry
                  key: registry.json
          volumeMounts:
            - name: repo-storage
              mountPath: /repos
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: repo-storage
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pacds-agent
  namespace: pacds
spec:
  selector:
    app: pacds-agent
  ports:
    - port: 3001
      targetPort: 3001
