apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: pacds
build:
  local:
    push: false
  artifacts:
    - image: pacds
      context: .
      docker:
        dockerfile: Dockerfile
        target: runtime
    - image: pacds-test-runner
      context: .
      docker:
        dockerfile: Dockerfile
        target: test-runner
manifests:
  rawYaml:
    - k8s/namespace.yaml
    - k8s/pacds.yaml
    - k8s/network-policies.yaml
    - k8s/dev/pacds-config.yaml
    - k8s/dev/fake-llm.yaml
    - k8s/dev/s3.yaml
    - k8s/dev/client.yaml
    - k8s/dev/test-runner.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: pacds
    namespace: pacds
    port: 8080
    localPort: 3002
