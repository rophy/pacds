apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: pacds
build:
  local:
    push: false
  artifacts:
    - image: pacds
      context: .
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/namespace.yaml
    - k8s/pacds.yaml
    - k8s/network-policies.yaml
    - k8s/dev/pacds-config.yaml
    - k8s/dev/fake-llm.yaml
    - k8s/dev/sample-logs.yaml
    - k8s/dev/support.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: pacds
    namespace: pacds
    port: 8080
    localPort: 3002
